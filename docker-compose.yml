services:
  postgres:
    image: postgres:16-alpine
    container_name: expense-postgres
    environment:
      POSTGRES_DB: expense_manager
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d expense_manager"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: expense-api
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__DefaultConnection: "Host=postgres;Port=5432;Database=expense_manager;Username=postgres;Password=postgres"
      Jwt__Secret: "CHANGE_ME__super-secret-key-with-at-least-32-characters!"
      Jwt__Issuer: "ExpenseManager"
      Jwt__Audience: "ExpenseManagerClient"
      # Tùy chọn: bật AI phân loại bằng Claude API
      # Anthropic__ApiKey: "sk-ant-..."
      Cors__AllowedOrigins__0: "http://localhost:8080"
      Cors__AllowedOrigins__1: "http://localhost:4200"
    ports:
      - "5000:8080"

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: expense-web
    depends_on:
      - api
    ports:
      - "8080:80"

volumes:
  postgres_data:
